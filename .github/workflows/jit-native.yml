# Isolated source-port gate for the native JIT runtime candidate.
# This does not produce a playable IPA or include copyrighted game files.
name: JIT native runtime port
on:
  workflow_dispatch:
  push:
    branches: ["feature/jit-harmony-experimental"]
    paths:
      - ".github/workflows/jit-native.yml"
      - "experimental/jit/build_native.py"
      - "experimental/jit/upstream-mono-ios-jit.patch"
      - "experimental/jit/MonoJitMemory.h"
      - "tools/mono/audit_jit_runtime.py"
concurrency:
  group: jit-native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  source-port:
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tooling
        run: |
          xcodebuild -version
          cmake --version
          ninja --version
      - name: Build pinned Mono 10 JIT static library
        run: python3 experimental/jit/build_native.py
      - name: Audit the JIT compiler symbols
        run: python3 tools/mono/audit_jit_runtime.py .work/jit-native/build/mono/mini/libmonosgen-2.0.a --require-backend
      - name: Smoke-link the ARM64 JIT runtime and executable-memory aliases
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          base=".work/jit-native/build/mono/mini"
          libraries=(libmonosgen-2.0.a libmono-component-marshal-ilgen-static.a
                     libmono-component-debugger-stub-static.a
                     libmono-component-hot_reload-stub-static.a
                     libmono-component-diagnostics_tracing-stub-static.a)
          force=()
          for lib in "${libraries[@]}"; do
            test -f "$base/$lib"
            force+=("-Wl,-force_load,$base/$lib")
          done
          xcrun clang++ -dynamiclib -arch arm64 -isysroot "$sdk" \
            -miphoneos-version-min=16.0 -std=c++17 -fobjc-arc -O2 \
            experimental/jit/MonoJitMemory.mm "${force[@]}" \
            -framework Foundation -framework Security -lz -liconv -lc++ \
            -Wl,-install_name,@rpath/libmono-jit-smoke.dylib \
            -o .work/jit-native/libmono-jit-smoke.dylib
          lipo -info .work/jit-native/libmono-jit-smoke.dylib
      - name: Upload native JIT candidate (not an IPA)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mono10-ios-arm64-jit-native-prototype
          path: |
            .work/jit-native/build/mono/mini/libmonosgen-2.0.a
            .work/jit-native/build/mono/mini/libmono-component-*.a
            .work/jit-native/libmono-jit-smoke.dylib
          if-no-files-found: error
          retention-days: 7
